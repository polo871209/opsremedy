# Replace every example value before you deploy. Values can read the environment as ${VAR}.
model:
  provider: anthropic
  investigation: claude-opus-5-5
  synthesis: claude-opus-5-5
  reasoning: medium
agent:
  maxTurns: 20
  toolExecution: sequential
  maxConcurrent: 10
  stallSeconds: 180
  turnsBySeverity:
    critical: 30
    error: 30
    warning: 20
    info: 10
session:
  dbPath: /data/opsremedy.db
  ttlSeconds: 15552000
  linkTtlSeconds: 604800
notify:
  flapWindowSeconds: 3600
timezone: UTC
systemContext: |
  - Public request path: client -> ingress gateway -> API gateway -> backend service.
  - The ingress gateway emits envoy access logs. Each backend service emits its own app logs.
  - Async work moves over Kafka, not HTTP.
  - Workloads are Kubernetes Deployments in namespace `default`.
# Parts of production that no tool reads, for the security feed threat assessment.
assessContext: |
  - Backend images build on node:24-slim. The runtime is Node.js 24.
  - Kafka runs on GCE VMs outside the cluster, so no tool reads its version.
gcp:
  project: example-gcp-project
kubernetes:
  namespace: default
prometheus:
  url: http://prometheus.example.svc.cluster.local:9090
  datasourceUid: example-datasource-uid
jaeger:
  addr: jaeger-query.example.svc.cluster.local:16685
kafka:
  brokers:
    - kafka.example.svc.cluster.local:9092
grafana:
  url: https://grafana.example.com
publicBaseUrl: https://opsremedy.example.com
maintainerOpenIds: []
# RSS feeds to post to Lark. Each new item also gets one threat assessment in its card's thread.
# feeds:
#   - url: https://feeds.example.com/security.rss
#     chatId: oc_example
# GitHub Actions workflow allowed to call POST /deploy/watch with its OIDC token.
# deploy:
#   repository: example-org/backend
